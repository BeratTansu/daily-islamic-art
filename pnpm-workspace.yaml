packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.5'
  - '@expo/config-plugins@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - '@expo/ui@57.0.4'
  - babel-preset-expo@57.0.2
  - expo-linking@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-router@57.0.4
  - expo@57.0.3
overrides:
  typescript: 5.9.3
